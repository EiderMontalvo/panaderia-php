version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: panaderia_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: panaderia_venta
    ports:
      - "3307:3306"
    volumes:
      - panaderia_venta_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: panaderia_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8888:80"

volumes:
  panaderia_venta_data:
